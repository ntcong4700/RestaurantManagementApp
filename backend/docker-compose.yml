services:
  database:
    container_name: Restaurant_Database
    image: postgres:17-alpine
    restart: "no"
    ports:
      - "$DB_PORT:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ../data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: Restaurant_Backend
    build:
      context: .
      dockerfile: Dockerfile
    image: restaurant-backend:latest
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Inside the compose network the database is reached by its service name
      # on the container port 5432 (DB_PORT in .env is the port on the host).
      DB_HOST: database
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    # Longer than the server's 10s shutdown timeout so in-flight requests can finish.
    stop_grace_period: 15s
