services:
  database:
    container_name: Restaurant_Database
    image: postgres:17-alpine
    restart: "no"
    ports:
      - "$DB_PORT:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ../data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5